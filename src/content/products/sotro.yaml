# Localized copy: faithful translations of the English claims above; the
# English record stays canonical for claim/proof binding. Native VI/ZH review
# is an Owner feedback checkpoint (plan v5 W3.4).
i18n:
  vi:
    shortDescription: "Dành cho người có phòng, căn hộ hay nhà cho thuê ở Việt Nam: xem tháng này còn ai chưa đóng tiền và hôm nay cần lo việc gì."
    jobs:
      - "Nhìn một lần là biết tháng này phòng hay căn nào chưa đóng tiền và hôm nay cần làm gì"
      - "Thu tiền và ghi nhận mỗi khoản đúng một lần, không cần sổ tay hay bảng tính"
      - "Giữ phòng và căn cho thuê, người thuê cùng thông tin tạm trú, chỉ số điện nước ở cùng một nơi"
    capabilities:
      - "Thu tiền có bước xem lại rồi mới xác nhận, mã QR chuyển khoản ngân hàng và biên nhận sao chép gửi qua Zalo"
      - "Chữ to, nút lớn, làm cho người lớn tuổi; điện thoại của người nhà tham gia chỉ bằng cách quét mã QR"
      - "Màn hình sẵn sàng cuối tháng: ai còn nợ, việc gì đến hạn, kèm bảng C06 tạm trú tải về ngay"
    primaryActionLabel: "Xem YENLUME"
  zh:
    shortDescription: "给在越南出租房间、公寓或整栋房子的房东：查看本月还有谁没交租、今天要处理什么。"
    jobs:
      - "一眼看清本月谁还欠租、今天要处理什么"
      - "收租并把每笔款项准确记录一次，不再需要表格"
      - "把房间和公寓、租客和他们的暂住登记、水电表读数都放在一个地方"
    capabilities:
      - "收租先核对再确认，提供银行转账二维码，收据可复制到 Zalo"
      - "为年长房东设计的大字号与大按钮；家人的手机扫描二维码即可加入"
      - "月末就绪视图：谁还欠租、哪些到期，并可下载 C06 暂住登记表"
