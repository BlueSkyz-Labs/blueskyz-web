slug: sotro
name: YENLUME
shortDescription: "For people who rent out rooms, apartments or a house in Vietnam: see who still owes this month and what needs doing today."
lifecycle: active
availability: public
publicLabel: Available
audience:
  - individual
jobs:
  - See at a glance who still owes rent this month and what needs doing today
  - Collect rent and record each payment once, correctly, without a spreadsheet
  - Keep rooms and apartments, tenants with their residence registration, and meter readings in one place
capabilities:
  - Collect rent with a review-then-confirm step, a bank-transfer QR code and a receipt to copy into Zalo
  - Large text and big buttons built for older landlords; a family helper's phone joins by scanning a QR code
  - A month-readiness view of who still owes and what is due, plus a C06 residence spreadsheet to download
platforms:
  - web
# schema.org SoftwareApplication category (Owner delegated best practice, 2026-10-04):
# rent, utilities and receipts for a landlord's rental business.
applicationCategory: BusinessApplication
# Owner 2026-10-24 (O-04): the app interface is Vietnamese (yenlume.blueskyzlabs.com serves
# <html lang="vi">). A local fact, not mirrored from the upstream profile.
appLanguages:
  - vi
primaryAction:
  type: explore
  label: Explore YENLUME
  href: https://blueskyzlabs.com/en/products/sotro/
# Sign-in link mirrors the upstream public profile (appAccess.signInUrl; ADR 0006 product
# subdomain). It is not rendered (Owner 2026-10-12, #575: no public app sign-in). Preview
